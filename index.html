<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Egmon-Chat — Connexion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="https://res.cloudinary.com/ka4h4lpk/image/upload/f_auto,q_auto/logo_nnkd8f" type="image/jpeg" />
</head>
<body class="min-h-screen bg-white text-gray-800 flex flex-col">

  <header class="flex items-center justify-center pt-6 pb-3">
    <h1 class="text-lg sm:text-xl font-bold tracking-wide text-gray-900">
      Kadea-Chat
    </h1>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 pb-12">
    <div class="w-full max-w-md">
      <div class="auth-form-box bg-white border border-gray-200 rounded-2xl p-8 shadow-sm">
        <h2 class="text-xl font-semibold text-center text-gray-900 mb-1">Connexion</h2>
        <p class="text-gray-500 text-sm text-center mb-8">Bienvenue, connectez-vous pour discuter</p>

        <form id="loginForm" class="space-y-5" novalidate>
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="votre email"
              autocomplete="email"
              class="auth-input w-full px-4 py-3 rounded-xl bg-white border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-transparent"
            >
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
              <a href="forgot-password.html" class="text-xs text-gray-500 hover:text-gray-900 hover:underline">Mot de passe oublié ?</a>
            </div>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              class="auth-input w-full px-4 py-3 rounded-xl bg-white border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-transparent"
            >
          </div>

          <button
            type="submit"
            id="loginBtn"
            class="w-full py-3 rounded-xl font-semibold bg-gray-900 text-white hover:bg-gray-800 transition"
          >
            Se connecter
          </button>
        </form>

        <p class="text-center text-gray-500 text-sm mt-6">
          Pas encore de compte ?
          <a href="register.html" class="text-gray-900 font-medium hover:underline">S'inscrire</a>
        </p>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
