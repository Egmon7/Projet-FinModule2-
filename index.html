<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Egmon-Chat — Connexion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-white text-gray-800 flex flex-col">

  <header class="flex items-center justify-center gap-2 pt-6 pb-3">
    <img
      src="images/logo.jpeg"
      alt="Logo Egmon"
      class="w-10 h-10 rounded-full object-cover"
    >
    <h1 class="text-lg sm:text-xl font-bold tracking-wide text-gray-900">
      Egmon-Chat
    </h1>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 pb-12">
    <div class="w-full max-w-md">
      <div class="bg-white border border-gray-200 rounded-2xl p-8 shadow-sm">
        <h2 class="text-xl font-semibold text-center text-gray-900 mb-1">Connexion</h2>
        <p class="text-gray-500 text-sm text-center mb-8">Bienvenue, connectez-vous pour discuter</p>

        <form action="chat.html" method="get" class="space-y-5">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="votre email"
              class="w-full px-4 py-3 rounded-xl bg-white border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-transparent"
            >
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Mot de passe</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              class="w-full px-4 py-3 rounded-xl bg-white border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-transparent"
            >
          </div>

          <button
            type="submit"
            class="w-full py-3 rounded-xl font-semibold bg-gray-900 text-white hover:bg-gray-800 transition"
          >
            Se connecter
          </button>
        </form>

        <p class="text-center text-gray-500 text-sm mt-6">
          Pas encore de compte ?
          <a href="register.html" class="text-gray-900 font-medium hover:underline">S'inscrire</a>
        </p>
      </div>
    </div>
  </main>

</body>
</html>
