<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Egmon-Chat — Inscription</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="https://res.cloudinary.com/ka4h4lpk/image/upload/f_auto,q_auto/logo_nnkd8f" type="image/jpeg" />
</head>
<body class="min-h-screen bg-white text-gray-800 flex flex-col">

  <header class="flex items-center justify-center pt-6 pb-3">
    <h1 class="text-lg sm:text-xl font-bold tracking-wide text-gray-900">
      Egmon-Chat
    </h1>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 pb-12">
    <div class="w-full max-w-2xl">
      <div class="auth-form-box bg-white border border-gray-200 rounded-2xl p-4 sm:p-8 shadow-sm">
        <h2 class="text-xl font-semibold text-center text-gray-900 mb-1">Inscription</h2>
        <p class="text-gray-500 text-sm text-center mb-8">Créez votre compte pour rejoindre le chat</p>

        <form id="registerForm" class="space-y-5" novalidate>
          <div class="grid grid-cols-2 gap-3 sm:gap-5">
            <div>
              <label for="fullName" class="block text-xs sm:text-sm font-medium text-gray-700 mb-1">Nom complet</label>
              <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="nom complet"
                autocomplete="name"
                class="auth-input w-full px-3 sm:px-4 py-2.5 sm:py-3 text-sm rounded-xl bg-white border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-transparent"
              >
            </div>

            <div>
              <label for="email" class="block text-xs sm:text-sm font-medium text-gray-700 mb-1">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="email"
                autocomplete="email"
                class="auth-input w-full px-3 sm:px-4 py-2.5 sm:py-3 text-sm rounded-xl bg-white border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-transparent"
              >
            </div>

            <div>
              <div class="flex items-center justify-between mb-1">
                <label for="password" class="block text-xs sm:text-sm font-medium text-gray-700">Mot de passe</label>
                <span id="passwordCounter" class="text-xs text-gray-400">0 caractère</span>
              </div>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                autocomplete="new-password"
                class="auth-input w-full px-3 sm:px-4 py-2.5 sm:py-3 text-sm rounded-xl bg-white border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-transparent"
              >
            </div>

            <div>
              <label for="confirmPassword" class="block text-xs sm:text-sm font-medium text-gray-700 mb-1">Confirmer</label>
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="••••••••"
                autocomplete="new-password"
                class="auth-input w-full px-3 sm:px-4 py-2.5 sm:py-3 text-sm rounded-xl bg-white border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-transparent"
              >
            </div>
          </div>

          <button
            type="submit"
            id="registerBtn"
            class="w-full py-3 rounded-xl font-semibold bg-gray-900 text-white hover:bg-gray-800 transition"
          >
            Créer mon compte
          </button>
        </form>

        <p class="text-center text-gray-500 text-sm mt-6">
          Déjà un compte ?
          <a href="index.html" class="text-gray-900 font-medium hover:underline">Se connecter</a>
        </p>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
