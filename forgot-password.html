<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Egmon-Chat — Mot de passe oublié</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="https://res.cloudinary.com/ka4h4lpk/image/upload/f_auto,q_auto/logo_nnkd8f" type="image/jpeg" />
</head>
<body class="min-h-screen bg-white text-gray-800 flex flex-col">

  <header class="flex items-center justify-center pt-6 pb-3">
    <h1 class="text-lg sm:text-xl font-bold tracking-wide text-gray-900">
      Egmon-Chat
    </h1>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 pb-12">
    <div class="w-full max-w-md">
      <div class="auth-form-box bg-white border border-gray-200 rounded-2xl p-8 shadow-sm">
        <h2 class="text-xl font-semibold text-center text-gray-900 mb-1">Mot de passe oublié</h2>
        <p id="forgotPasswordHint" class="text-gray-500 text-sm text-center mb-8">
          Saisissez votre email pour recevoir un code à 6 chiffres
        </p>

        <form id="forgotPasswordForm" class="space-y-5" novalidate>
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="votre email"
              autocomplete="email"
              class="auth-input w-full px-4 py-3 rounded-xl bg-white border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-transparent"
            >
          </div>

          <button
            type="button"
            id="sendCodeBtn"
            class="w-full py-3 rounded-xl font-semibold bg-gray-900 text-white hover:bg-gray-800 transition"
          >
            Envoyer le code
          </button>

          <div id="resetPasswordFields" class="hidden space-y-5 pt-1 border-t border-gray-100">
            <p class="text-gray-500 text-sm text-center pt-4">
              Un code a été envoyé à votre adresse email.
            </p>

            <div>
              <label for="code" class="block text-sm font-medium text-gray-700 mb-1.5">Code reçu par email</label>
              <input
                type="text"
                id="code"
                name="code"
                inputmode="numeric"
                maxlength="6"
                placeholder="123456"
                autocomplete="one-time-code"
                class="auth-input w-full px-4 py-3 rounded-xl bg-white border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-transparent tracking-widest text-center"
              >
            </div>

            <div>
              <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Nouveau mot de passe</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                autocomplete="new-password"
                class="auth-input w-full px-4 py-3 rounded-xl bg-white border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-transparent"
              >
            </div>

            <div>
              <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1.5">Confirmer le mot de passe</label>
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="••••••••"
                autocomplete="new-password"
                class="auth-input w-full px-4 py-3 rounded-xl bg-white border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-transparent"
              >
            </div>

            <button
              type="submit"
              id="resetPasswordBtn"
              class="w-full py-3 rounded-xl font-semibold bg-gray-900 text-white hover:bg-gray-800 transition"
            >
              Réinitialiser le mot de passe
            </button>
          </div>
        </form>

        <p class="text-center text-gray-500 text-sm mt-6">
          <a href="index.html" class="text-gray-900 font-medium hover:underline">Retour à la connexion</a>
        </p>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
